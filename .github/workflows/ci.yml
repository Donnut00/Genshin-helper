name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Windows Verification & Audit
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pillow

      - name: Compile-check Python sources
        run: |
          $env:PYTHONUTF8 = "1"
          $files = @(Get-Item main.py) + @(Get-ChildItem -Recurse -Include *.py -Path src, scripts, tests)
          foreach ($file in $files) {
            python -m py_compile $file.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Write-Host "Compiled $($files.Count) Python files successfully."

      - name: Run unit tests (unittest discovery)
        run: |
          $env:PYTHONUTF8 = "1"
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Verify v4.5 release architecture
        run: |
          $env:PYTHONUTF8 = "1"
          python tests/verify_v45_release.py

      - name: Verify single-monitor & 64-bit Win32 invariants
        run: |
          $env:PYTHONUTF8 = "1"
          python tests/verify_single_monitor.py

      - name: Verify v5 public readiness suite
        run: |
          $env:PYTHONUTF8 = "1"
          python tests/verify_public_readiness_v5.py

      - name: Run release privacy & leak audit
        run: |
          $env:PYTHONUTF8 = "1"
          python scripts/audit_release.py

      - name: Smoke-check license collector
        run: |
          $env:PYTHONUTF8 = "1"
          python scripts/collect_licenses.py
