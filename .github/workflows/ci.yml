name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Windows Verification & Audit
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile-check Python sources
        run: |
          $env:PYTHONUTF8 = "1"
          $files = @(Get-Item main.py) + @(Get-ChildItem -Recurse -Include *.py -Path src, scripts, tests)
          foreach ($file in $files) {
            python -m py_compile $file.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Write-Host "Compiled $($files.Count) Python files successfully."

      - name: Syntax-check Extension JS and CRLF invariants
        run: |
          node --check extension/page_main.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check extension/background.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check extension/popup.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check extension/content_bridge.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check extension/i18n.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "b=open('extension/page_main.js','rb').read(); assert b.count(b'\r\n') == b.count(b'\n'); assert b'setIcon(' not in b"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run unit tests (unittest discovery)
        run: |
          $env:PYTHONUTF8 = "1"
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Verify v4.5 release architecture
        run: |
          $env:PYTHONUTF8 = "1"
          python tests/verify_v45_release.py

      - name: Verify single-monitor & 64-bit Win32 invariants
        run: |
          $env:PYTHONUTF8 = "1"
          python tests/verify_single_monitor.py

      - name: Verify bilingual i18n & Extension v5
        run: |
          $env:PYTHONUTF8 = "1"
          python tests/verify_i18n_and_ext_v5.py

      - name: Verify Navigation Mini-HUD
        run: |
          $env:PYTHONUTF8 = "1"
          python tests/verify_nav_hud_v5.py

      - name: Verify Navigation UX & priority
        run: |
          $env:PYTHONUTF8 = "1"
          python tests/verify_nav_ux_v54.py

      - name: Verify smart hotkey conflicts & capture visibility
        run: |
          $env:PYTHONUTF8 = "1"
          python tests/verify_hotkey_conflicts_and_capture.py

      - name: Verify v5 public readiness suite
        run: |
          $env:PYTHONUTF8 = "1"
          python tests/verify_public_readiness_v5.py

      - name: Run release privacy & strict IP audit
        run: |
          $env:PYTHONUTF8 = "1"
          python scripts/audit_release.py --strict-ip

      - name: Smoke-check license collector
        run: |
          $env:PYTHONUTF8 = "1"
          python scripts/collect_licenses.py
