name: Release Setup Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Windows Setup Installer & Publish Release
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Install Inno Setup 6
        run: choco install innosetup -y --no-progress

      - name: Verify release readiness & strict IP hygiene
        run: |
          $env:PYTHONUTF8 = "1"
          python tests/verify_v45_release.py
          python tests/verify_i18n_and_ext_v5.py
          python tests/verify_hotkey_conflicts_and_capture.py
          python tests/verify_public_readiness_v5.py
          python scripts/audit_release.py --strict-ip

      - name: Build, Bundle Licenses, Audit & Package Windows Setup Installer
        run: |
          $env:PYTHONUTF8 = "1"
          $env:PYTHON_EXE = (Get-Command python).Source
          pwsh -NoProfile -ExecutionPolicy Bypass -File installer/build_release.ps1

      - name: Publish GitHub Release (Setup.exe + SHA256SUMS.txt)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/installer/GenshinHelper-Setup-v*.exe
            dist/installer/SHA256SUMS.txt

      - name: Upload workflow artifact (manual dispatch preview)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: GenshinHelper-Setup
          path: |
            dist/installer/GenshinHelper-Setup-v*.exe
            dist/installer/SHA256SUMS.txt
          if-no-files-found: error
