# cargo-nextest workspace configuration for fast feedback loops vs heavy scratch/ CV suites.

[profile.default]
# Warn early if any unit test regresses in latency; fail runaway tests after 60s.
slow-timeout = { period = "15s", terminate-after = 4 }
fail-fast = false
status-level = "pass"

[profile.cv-heavy]
# Used with: cargo nextest run --manifest-path rust/Cargo.toml --workspace --profile cv-heavy --cargo-profile cv-bench --run-ignored all
slow-timeout = { period = "60s", terminate-after = 5 }
fail-fast = false
status-level = "pass"
